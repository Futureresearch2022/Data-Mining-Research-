[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "schematics-ai"
version = "0.1.0"
description = "Generate technical schematics and drafting drawings from DeepSeek and Gemini models, rendered to SVG and DXF."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Futureresearch2022" }]
dependencies = [
    "pydantic>=2.6",
    "ezdxf>=1.1",
]

[project.optional-dependencies]
deepseek = ["openai>=1.30"]
gemini = ["google-genai>=0.3"]
all = ["openai>=1.30", "google-genai>=0.3"]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "openai>=1.30",
    "google-genai>=0.3",
]

[project.scripts]
schematics-ai = "schematics_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
